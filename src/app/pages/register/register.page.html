<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="register-container">
    <div class="logo-section">
      <ion-icon name="person-add-outline" class="app-logo"></ion-icon>
      <h1>Create Account</h1>
      <p>Sign up to get started</p>
    </div>

    <ion-card class="register-card">
      <ion-card-header>
        <ion-card-title>Register New Account</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="register()">
          <ion-item lines="full" class="input-item">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-input
              type="text"
              placeholder="Full Name"
              [(ngModel)]="registerData.name"
              name="name"
              required
              autocomplete="name"
            ></ion-input>
          </ion-item>

          <ion-item lines="full" class="input-item">
            <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
            <ion-input
              type="email"
              placeholder="Email"
              [(ngModel)]="registerData.email"
              name="email"
              required
              autocomplete="email"
            ></ion-input>
          </ion-item>

          <ion-item lines="full" class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
            <ion-input
              type="password"
              placeholder="Password (min 6 characters)"
              [(ngModel)]="registerData.password"
              name="password"
              required
              autocomplete="new-password"
            ></ion-input>
          </ion-item>

          <ion-item lines="full" class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
            <ion-input
              type="password"
              placeholder="Confirm Password"
              [(ngModel)]="registerData.confirmPassword"
              name="confirmPassword"
              required
              autocomplete="new-password"
            ></ion-input>
          </ion-item>

          <ion-button
            expand="block"
            type="submit"
            class="register-button"
            size="large"
          >
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            Create Account
          </ion-button>
        </form>

        <div class="login-link">
          <ion-text color="medium">
            Already have an account?
            <a routerLink="/login" class="link-text">Login here</a>
          </ion-text>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
